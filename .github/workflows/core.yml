name: Core modules and package
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: core-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: fixture-only
          POSTGRES_DB: core_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      SUBMISSION_TEST_DATABASE_URL: postgresql://postgres:fixture-only@127.0.0.1:5432/core_test
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 20.19.0
          cache: npm
      - run: npm ci --ignore-scripts
      - run: docker pull node@sha256:8094c002d08262dba12645a3b4a15cd6cd627d30bc782f53229a2ec13ee22a00
      - run: npm run test:modules
      - run: node --test examples/research/application.test.mjs
      - run: npm exec --yes --package=typescript@5.9.3 -- tsc --noEmit --strict --lib es2022,dom --module nodenext --moduleResolution nodenext examples/core-http/client-types.mts
      - run: npm run verify:core-package
      - run: npm run verify:release-upgrade
      - run: npm run verify:types-package
