<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Assistant · Inbox demo</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f5f5f2;color:#252823;font:16px system-ui}header{padding:22px 32px;border-bottom:1px solid #dadbd4;display:flex;justify-content:space-between}small{color:#677063}main{max-width:1120px;margin:32px auto;display:grid;grid-template-columns:360px 1fr;gap:24px;padding:0 20px}.panel{background:white;border:1px solid #dedfd8;border-radius:16px;padding:24px}h1{font-size:22px;margin:0}h2{font-size:18px}button,input{font:inherit}button{border:1px solid #d4d7cd;border-radius:8px;background:#f7f8f4;padding:9px 12px;cursor:pointer}button:hover{background:#e8eddf}.item{display:block;width:100%;text-align:left;margin:10px 0;padding:14px}.badge{background:#2b543f;color:white;border-radius:20px;padding:3px 9px}#detail{margin-top:24px;line-height:1.6}#messages{min-height:230px;max-height:420px;overflow:auto}.message{padding:12px 14px;margin:10px 0;background:#f2f5ec;border-radius:10px;white-space:pre-wrap}.user{background:#f1f1f1}form{display:flex;gap:8px;margin-top:20px}input{min-width:0;flex:1;padding:12px;border:1px solid #d4d7cd;border-radius:8px}.suggestions{display:flex;gap:8px;flex-wrap:wrap}#status{color:#79521e;min-height:24px}#archive-toggle{margin-top:12px}@media(max-width:750px){main{grid-template-columns:1fr}}
</style>
<header><h1>Assistant <small>/ Service provider workspace</small></h1><small>Local fixture · No live business actions</small></header>
<main><aside class="panel"><h2>Inbox <span id="badge" class="badge">0</span></h2><div id="items"></div><button id="more" hidden>Load more</button><button id="archive-toggle">Show archived</button><section id="detail"></section></aside>
<section class="panel"><h2>Your workspace assistant</h2><p><small>Deterministic interaction demo. Connect your Host model to these same capabilities.</small></p><div id="messages" aria-live="polite"></div><div class="suggestions"><button data-prompt="Help me set up">Set up workspace</button><button data-prompt="Show orders">View orders</button></div><form id="chat"><input id="prompt" aria-label="Message" placeholder="Describe your service…" required><button>Send</button></form><p id="status" role="status"></p></section></main>
<script type="module">
const $=id=>document.getElementById(id);let archived=false,next=null,selected=null,step=null,draft='';
async function call(name,input={}){const response=await fetch('/api',{method:'POST',headers:{'content-type':'application/json',authorization:'Bearer __TOKEN__'},body:JSON.stringify({name,input})});const body=await response.json();if(!response.ok)throw Error(body.error);return body.result;}
function message(text,user=false){const e=document.createElement('div');e.className='message'+(user?' user':'');e.textContent=text;$('messages').append(e);e.scrollIntoView({block:'nearest'});}
async function refresh(append=false){const page=await call('inbox.list',{archived,limit:10,...(append&&next?{before:next}:{})});$('badge').textContent=page.unreadCount;if(!append)$('items').replaceChildren();for(const item of page.items){const b=document.createElement('button');b.className='item';b.textContent=(item.readAt?'':'● ')+item.title;b.onclick=()=>safe(()=>detail(item.id));$('items').append(b);}next=page.next;$('more').hidden=!next;}
function button(text,action,id){const b=document.createElement('button');b.textContent=text;if(id)b.id=id;b.onclick=()=>safe(action);$('detail').append(b);}
async function detail(id){selected=await call('inbox.get',{id});$('detail').replaceChildren();const h=document.createElement('h2');h.textContent=selected.title;const p=document.createElement('p');p.textContent=selected.summary;$('detail').append(h,p);
button(selected.readAt?'Mark unread':'Mark read',async()=>{await call(selected.readAt?'inbox.mark_unread':'inbox.mark_read',{id});await refresh();await detail(id);},'mark');
button('Archive',async()=>{await call('inbox.archive',{id});$('detail').replaceChildren();await refresh();},'archive');
button('Discuss',async()=>{await call('inbox.project',{id,kind:'conversation'});message(selected.summary);},'discuss');
if(selected.actionRef)button('Create review task',async()=>{const r=await call('inbox.project',{id,kind:'task'});message('Review task '+r.state+'. Publishing still requires your explicit review.');},'task');
if(selected.relatedObjectRef)button('View order',async()=>{const r=await call('orders.read',{id:selected.relatedObjectRef});message('Order '+r.id+': '+r.status);},'order');}
async function reply(text){message(text,true);if(text==='Show orders'){const r=await call('orders.list');message(r.items.map(x=>'Order '+x.id+': '+x.status).join('\n'));return;}
if(text==='Help me set up'){const p=await call('profile.read');if(!p.name){step='name';message('Your workspace needs a display name. What name should we use?');}else{step='description';message('Describe the service you offer in your own words.');}return;}
if(step==='name'){await call('profile.configure',{name:text});step='description';message('Saved. Now describe the service you offer.');return;}
if(step==='description'){draft=text;await call('capability.describe',{description:draft});step='review';message('Please review this description:\n'+draft+'\nType “Publish” to publish it, or send a revised description.');return;}
if(step==='review'&&text.toLowerCase()==='publish'){await call('capability.publish',{reviewedDescription:draft});step=null;message('Your reviewed capability is published in this fixture workspace.');return;}
if(step==='review'){draft=text;await call('capability.describe',{description:draft});message('Revised draft:\n'+draft+'\nType “Publish” when ready.');return;}
message('Choose “Set up workspace” to configure your profile and describe your service, or “View orders”.');}
async function safe(fn){$('status').textContent='';try{await fn();}catch(e){$('status').textContent=e.message;}}
$('chat').onsubmit=e=>{e.preventDefault();const text=$('prompt').value;$('prompt').value='';safe(()=>reply(text));};document.querySelectorAll('[data-prompt]').forEach(b=>b.onclick=()=>safe(()=>reply(b.dataset.prompt)));
$('archive-toggle').onclick=()=>safe(async()=>{archived=!archived;$('archive-toggle').textContent=archived?'Show active':'Show archived';await refresh();});$('more').onclick=()=>safe(()=>refresh(true));
await safe(async()=>{await refresh();const timeline=await call('demo.timeline');for(const event of timeline.events)if(event.data.summary)message(event.data.summary);message('I can help set up your workspace, prepare a capability description, and show your orders.');});window.fixtureReady=true;
</script></html>
